services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: procurement
      MYSQL_USER: procurement
      MYSQL_PASSWORD: procurement
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/procurement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DB_USER: procurement
      DB_PASSWORD: procurement
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
